@if (isAdmin()) {
  <router-outlet />
} @else {
  <a
    href="#contenido"
    class="sr-only focus:not-sr-only focus:absolute focus:left-3 focus:top-3 focus:z-50 focus:rounded-sm focus:px-3 focus:py-2"
    style="background: var(--verde-guadua); color: var(--blanco-taller);"
  >
    Saltar al contenido
  </a>
  <app-header />
  <main id="contenido" class="min-h-[60vh]">
    <router-outlet />
  </main>
  <app-footer />
}
