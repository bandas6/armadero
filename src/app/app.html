@if (isAdmin()) {
  <router-outlet />
} @else {
  <a
    href="#contenido"
    class="sr-only focus:not-sr-only focus:absolute focus:left-3 focus:top-3 focus:z-50 focus:px-4 focus:py-3 focus:font-semibold"
    style="background: var(--hoja); color: #fff;"
  >
    Saltar al contenido
  </a>
  <app-header />
  <main id="contenido" class="min-h-[60vh]">
    <router-outlet />
  </main>
  <app-footer />
}
